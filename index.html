<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B4F">
<title>My Store</title>
<meta name="application-name" content="My Store">
<meta name="apple-mobile-web-app-title" content="My Store">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-192.png" alt="" width="96" height="96">
  <div class="splash-shop" id="splash-shop"></div>
  <div class="splash-app">My Store</div>
  <div class="splash-dots"><i></i><i></i><i></i></div>
</div>
<header class="top">
  <div class="top-title"><b id="store-name">My Store</b><small id="sync-line"></small></div>
  <button class="lang" id="lang-btn" type="button">தமிழ்</button>
</header>

<nav class="tabs">
  <button type="button" class="on" data-view="add" data-t>Add product</button>
  <button type="button" data-view="list"><span data-t>My products</span> <span class="count" id="list-count"></span></button>
</nav>

<main>
  <section id="view-add">
    <div class="field">
      <span><span data-t>Photos</span> <em class="req">*</em> <small data-t>(1 to 4: front, back, sides)</small></span>
      <div class="photos" id="photos"></div>
      <input type="file" id="cam" accept="image/*" capture="environment" hidden>
      <input type="file" id="gal" accept="image/*" multiple hidden>
      <button type="button" class="link" id="gal-btn" data-t>Pick from gallery</button>
    </div>
    <div class="grid2">
      <label class="field"><span><span data-t>Quantity in stock</span> <em class="req">*</em></span><input id="qty" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="0"></label>
      <label class="field"><span><span data-t>Selling price (₹)</span> <em class="req">*</em></span><input id="price" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="0"></label>
      <label class="field"><span data-t>Buying price (₹)</span><input id="cost" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="0"></label>
      <div class="margin" id="margin"></div>
    </div>
    <label class="field"><span data-t>Source</span><textarea id="source" rows="4" placeholder="Where it was bought from: shop or supplier name, phone, notes" data-t-ph></textarea></label>
    <div class="err" id="err"></div>
    <button type="button" class="btn primary" id="save" data-t>Save and add next</button>
    <p class="note" data-t>Saved products upload by themselves, even if the internet comes back later. Names and barcodes are filled in overnight.</p>
  </section>

  <section id="view-list" hidden>
    <div class="list-head" id="list-head"></div>
    <div id="list"></div>
  </section>

  <section id="no-store" hidden>
    <div class="empty">
      <h2 data-t>Open the link from your shop owner</h2>
      <p data-t>This app needs the shop link to know which shop the products belong to.</p>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>
<div class="sheet-bg" id="sheet" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
